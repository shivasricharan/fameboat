[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Consolidate retired Fameboat 1.0 acquisition pages into the current audit journey.
[[redirects]]
  from = "/services"
  to = "/#audit"
  status = 301

[[redirects]]
  from = "/pricing"
  to = "/#audit"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/#audit"
  status = 301

[[redirects]]
  from = "/how-we-work"
  to = "/#how"
  status = 301

[[redirects]]
  from = "/digital-credibility-sprint"
  to = "/#audit"
  status = 301

[[redirects]]
  from = "/about"
  to = "/#top"
  status = 301

[[redirects]]
  from = "/work/*"
  to = "/#top"
  status = 301

[[redirects]]
  from = "/work"
  to = "/#top"
  status = 301

[[redirects]]
  from = "/case-studies"
  to = "/#top"
  status = 301

[[redirects]]
  from = "/case-studies/metro-tv-telugu"
  to = "/#top"
  status = 301

[[redirects]]
  from = "/case-studies/iia-telangana"
  to = "/#top"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
